name: CI

# Определяем события, которые запускают pipeline
on:
  # при каждом push
  push:
  # при каждом pull
  pull_request:
# Задачи pipeline
jobs:
  # Автоматическое тестирование
  test:
    runs-on: ubuntu-latest
    steps:
      # Получаем исходный код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4
      # Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Устанавливаем зависимости проекта
      - name: Install dependencies
        run: |
          # Обновляем pip
          python -m pip install --upgrade pip
          # Устанавливаем зависимости из requirements.txt
          pip install -r requirements.txt
      # Автоматические тесты
      - name: Run tests
        env:
          # Добавляем корень репозитория в путь поиска Python-модулей
          PYTHONPATH: .
        run: |
          # Запускаем pytest
          pytest
  build:
    # Запускаем build только после успешного test
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Получаем исходный код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4
      # Авторизация в GitHub Container Registry
      - name: Login in to GHCR
        uses: docker/login-action@v3
        with:
          # Адрес GitHub Container Registry
          registry: ghcr.io
          # Имя пользователя GitHub
          username: ${{ github.actor }}
          # Автоматический токен GitHub Actions
          password: ${{ secrets.GITHUB_TOKEN }}
      # Собираем Docker image
      - name: Build Docker image
        run: |
          # Формируем имя Docker-образа
          IMAGE_NAME=ghcr.io/${{ github.repository }}:latest
          # Собираем Docker-образ
          docker build -t $IMAGE_NAME .
      # Публикуем Docker image
      - name: Push Docker image
        run: |
          # Формируем имя Docker-образа
          IMAGE_NAME=ghcr.io/${{ github.repository }}:latest
          # Загружаем образ в GitHub Container Registry
          docker push $IMAGE_NAME
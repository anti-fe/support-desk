name: CI

# Определяем события, которые запускают pipeline
on:
  # при каждом push
  push:
  # при каждом pull
  pull_request:
# Задачи pipeline
jobs:
  # Автоматическое тестирование
  test:
    runs-on: ubuntu-latest
    steps:
      # Получаем исходный код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4
      # Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Устанавливаем зависимости проекта
      - name: Install dependencies
        run: |
          # Обновляем pip
          python -m pip install --upgrade pip
          # Устанавливаем зависимости из requirements.txt
          pip install -r requirements.txt
      # Автоматические тесты
      - name: Run tests
        env:
          # Добавляем корень репозитория в путь поиска Python-модулей
          PYTHONPATH: .
        run: |
          # Запускаем pytest
          pytest
  build:
    # Сборка запускается только после успешного тестирования
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Получаем исходный код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4
      # Авторизуемся в GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          # Адрес GitHub Container Registry
          registry: ghcr.io
          # Пользователь, запустивший workflow
          username: ${{ github.actor }}
          # Автоматический токен GitHub Actions
          password: ${{ secrets.GITHUB_TOKEN }}
      # Собираем Docker-образ с двумя тегами
      - name: Build Docker image
        run: |
          # Формируем имя Docker-репозитория
          IMAGE_NAME=ghcr.io/${{ github.repository }}
          # Формируем тег на основе SHA текущего commit
          IMAGE_TAG=sha-${{ github.sha }}
          # Собираем образ с тегом latest
          docker build \
            -t $IMAGE_NAME:latest \
            .
          # Добавляем тег конкретного commit
          docker tag \
            $IMAGE_NAME:latest \
            $IMAGE_NAME:$IMAGE_TAG
      # Публикуем Docker-образы в GHCR
      - name: Push Docker images
        run: |
          # Формируем имя Docker-репозитория
          IMAGE_NAME=ghcr.io/${{ github.repository }}
          # Формируем тег текущего commit
          IMAGE_TAG=sha-${{ github.sha }}
          # Публикуем последнюю версию
          docker push $IMAGE_NAME:latest
          # Публикуем версию конкретного commit
          docker push $IMAGE_NAME:$IMAGE_TAG
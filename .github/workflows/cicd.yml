name: CI/CD

on:
  push:
  pull_request:
# Разрешения GitHub Actions
permissions:
  # Разрешаем читать репозиторий
  contents: read
  # Разрешаем публиковать Docker-образы
  packages: write
jobs:
  # ==========================================
  # ЭТАП 1. ТЕСТИРОВАНИЕ
  # ==========================================
  test:
    runs-on: ubuntu-latest
    steps:
      # Получаем исходный код
      - name: Checkout repository
        uses: actions/checkout@v4
      # Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Используем Python 3.12
          python-version: "3.12"
      # Устанавливаем зависимости
      - name: Install dependencies
        run: |
          # Обновляем pip
          python -m pip install --upgrade pip

          # Устанавливаем зависимости проекта
          pip install -r requirements.txt
      # Запускаем тесты
      - name: Run tests
        env:
          # Добавляем корень проекта в PYTHONPATH
          PYTHONPATH: .
        run: |
          # Запускаем pytest
          pytest

  # ==========================================
  # ЭТАП 2. СБОРКА И ПУБЛИКАЦИЯ
  # ==========================================
  build:
    # Build запускается после успешного тестирования
    needs: test
    # Выполняем только для push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Получаем исходный код
      - name: Checkout repository
        uses: actions/checkout@v4
      # Авторизуемся в GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          # GitHub Container Registry
          registry: ghcr.io
          # Пользователь GitHub
          username: ${{ github.actor }}
          # Токен GitHub Actions
          password: ${{ secrets.GITHUB_TOKEN }}
      # Собираем Docker-образ
      - name: Build Docker image
        run: |
          # Формируем имя Docker-репозитория
          IMAGE_NAME=ghcr.io/${{ github.repository }}
          # Формируем тег текущего commit
          IMAGE_TAG=sha-${{ github.sha }}
          # Собираем образ с тегом latest
          docker build \
            -t $IMAGE_NAME:latest \
            .
          # Добавляем тег конкретного commit
          docker tag \
            $IMAGE_NAME:latest \
            $IMAGE_NAME:$IMAGE_TAG
      # Публикуем образы
      - name: Push Docker images
        run: |
          # Формируем имя Docker-репозитория
          IMAGE_NAME=ghcr.io/${{ github.repository }}
          # Формируем тег текущего commit
          IMAGE_TAG=sha-${{ github.sha }}
          # Публикуем latest
          docker push $IMAGE_NAME:latest
          # Публикуем версию commit
          docker push $IMAGE_NAME:$IMAGE_TAG